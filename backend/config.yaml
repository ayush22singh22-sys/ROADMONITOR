# Road Monitor backend configuration.
# Every threshold lives here (mirrors android pipeline defaults, plan section 3).

server:
  host: 0.0.0.0
  port: 8000

db:
  # Dev default runs embedded SQLite so the laptop needs no install.
  # Production / Phase C: postgresql+psycopg://USER:PASS@localhost:5432/roadmonitor
  # (PostGIS DDL: backend/sql/schema_postgres.sql, compose: docker-compose.yml)
  url: "sqlite:///./data/roadmonitor.db"

api:
  request: {max_body_mb: 25}
  device_key_bytes: 32
  auth: {require_device_key: false}   # Phase A app does not send keys yet; tighten when it does
  insert_batch_size: 1000

# ---- thresholds consumed from Phase C processing onward ----
sampling: {accel_hz: 50, gps_hz: 1}
filter: {bandpass_low: 0.5, bandpass_high: 20.0, order: 2, gravity_lp_hz: 0.5}
speed: {min_kmh: 5.0, max_kmh: 120.0}
event:
  abs_threshold_ms2: 3.0
  sigma_k: 3.5
  sigma_window_s: 5.0
  refractory_ms: 300
  pulse_width_ms: {pothole: [40, 200], bump: [200, 600]}
roughness: {bin_m: 10, speed_alpha: 0.7, min_samples_per_bin: 20, speed_floor_mps: 1.5}
gps: {max_accuracy_m: 25, trim_start_end_m: 150}
mapmatch: {radius_m: 20, min_confidence: 0.5, enabled: false, base_url: "http://localhost:5000", profile: driving}
aggregate: {recency_tau_days: 60, conf_k: 2.0, conf_trips_weight: 0.5, ref_speed_mps: 8.33}
cluster: {eps_m: 8, min_samples: 2, confirm_min_devices: 2, confirm_min_trips: 3}
classes: {method: percentile, cuts: [50, 75, 90]}

# ---- Road Anomaly Priority Pipeline (server-side, rule-based) ----
# Per-vehicle_type threshold blocks. Values are engineering defaults pending
# calibration with real multi-vehicle data; outputs carry
# "threshold-based, unvalidated".
anomaly:
  sample_hz: 50
  base:                                  # baseline block (bike-like)
    dip_abs_ms2: 4.0        # pothole: downward dip must exceed this
    spike_abs_ms2: 9.0      # impact spike must exceed this
    pothole_window_ms: [40, 200]
    bump_window_ms: [200, 600]
    bump_peak_abs_ms2: 5.0  # bump peak range top (below spike level)
    rough_rms_ms2: 2.4      # sustained RMS above this = rough road
    rough_window_ms: 1000   # sustainability window for rough rule
    rough_overlap: 0.6      # required fraction of window above threshold
    gyro_z_rad_s: 0.5       # sharp turn/swerve gate
    gyro_shield_ms: 400     # drop events this close to a turn
    refractory_ms: 300      # min spacing between events of any type
  vehicle_scale:              # multiplies the magnitude thresholds above
    bike: 1.0
    car: 1.2
    bus: 1.5
    e_rickshaw: 0.75

  # matching + aggregation + priority (additive stage thresholds)
  match_radius_m: 15          # max GPS->edge snap distance
  min_confirm_trips: 3        # "confirmed" needs >= 3 independent trips
  boundary_grace_m: 200       # events this close to a trip start/end (post-trim)
                              # are flagged and cannot confirm a segment
  poi_buffer_m: 250           # POI impact buffer, measured ALONG the road graph
  poi_snap_max_distance_m: 100 # ignore POIs too far from the mapped road network
  severity_p95_weight: 0.7    # blend robust event severity: 70% p95 + 30% mean
  poi_weights:                # AHP-tunable site policy
    hospital: 1.0
    school: 0.9
    college: 0.7
    university: 0.7
    dormitory: 0.7
    marketplace: 0.6
    bus_station: 0.6
  road_class_weights:
    primary: 1.0
    secondary: 0.8
    tertiary: 0.6
    residential: 0.4
    unclassified: 0.4
    service: 0.2
    track: 0.2
  priority_weights:           # weights sum to 1.0; set via AHP later
    severity: 0.45
    frequency: 0.20
    poi: 0.20
    road_class: 0.10
    vulnerable: 0.05

severity:
  weights: {p95: 0.6, rms: 0.4}   # weighted mix; AHP-tunable later
  # normalization anchors (m/s²) per vehicle - calibration pending
  refs:
    bike: {p95: 6.0, rms: 2.5}
    car: {p95: 4.5, rms: 1.8}
    bus: {p95: 3.5, rms: 1.4}
    e_rickshaw: {p95: 7.0, rms: 3.0}

# ---- Phase E validation (python -m roadmonitor.validation) ----
validation:
  pos_tol_m: 25            # link positions must agree within this to be "the same link"
  min_class_concordance: 0.9   # fraction of matched links with identical class
  min_score_corr: 0.9      # Pearson r of matched score_norms
  max_norm_ratio: 1.25     # max/min score_norm across speed runs for one zone
  n_bins_per_zone: 3       # synthetic trip layout: bins per roughness zone
  speed_runs_mps: [4.0, 8.33, 16.66]   # speeds for the speed-normalisation check
